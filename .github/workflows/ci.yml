name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Backend/VerhuurApplicatieAPI.csproj

      - name: Build
        run: dotnet build Backend/VerhuurApplicatieAPI.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test Backend.Tests/Backend.Tests.csproj --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: Backend.Tests/TestResults/results.trx

  frontend:
    name: Frontend — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Frontend

      - name: Run tests
        run: npm test
        working-directory: Frontend

      - name: Build
        run: npm run build
        working-directory: Frontend

  docker:
    name: Docker — Build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build
        env:
          SA_PASSWORD: "CI_TestPassword1!"
          JWT_SECRET: "ci-test-secret-minimaal-32-tekens-lang!!"
